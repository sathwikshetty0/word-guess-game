<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiQuest | Word Challenge</title>
    <meta name="description" content="A high-fidelity word guessing game with stunning glassmorphism design.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <div class="logo-icon-container">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <h1>LEXI<span>QUEST</span></h1>
            </div>
            <div class="header-actions">
                <button id="help-btn" class="icon-btn" title="How to play">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                        <line x1="12" y1="17" x2="12.01" y2="17" />
                    </svg>
                </button>
            </div>
        </header>

        <main id="game-board">
            <!-- Grid generated by JS -->
        </main>

        <div id="message-container"></div>

        <footer id="keyboard">
            <!-- Keyboard generated by JS -->
        </footer>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="help-modal" class="modal hidden">
            <button class="close-modal">&times;</button>
            <h2>How To Play</h2>
            <p>Guess the word in 6 tries.</p>
            <div class="examples">
                <div class="example">
                    <div class="row">
                        <div class="tile correct">W</div>
                        <div class="tile">E</div>
                        <div class="tile">A</div>
                        <div class="tile">R</div>
                        <div class="tile">Y</div>
                    </div>
                    <p><strong>W</strong> is in the correct spot.</p>
                </div>
                <div class="example">
                    <div class="row">
                        <div class="tile">P</div>
                        <div class="tile present">I</div>
                        <div class="tile">L</div>
                        <div class="tile">O</div>
                        <div class="tile">T</div>
                    </div>
                    <p><strong>I</strong> is in the word but wrong spot.</p>
                </div>
                <div class="example">
                    <div class="row">
                        <div class="tile">V</div>
                        <div class="tile">A</div>
                        <div class="tile">G</div>
                        <div class="tile absent">U</div>
                        <div class="tile">E</div>
                    </div>
                    <p><strong>U</strong> is not in the word.</p>
                </div>
            </div>
        </div>

        <div id="stats-modal" class="modal hidden">
            <button class="close-modal">&times;</button>
            <h2 id="stats-title">Result</h2>
            <div class="stats-body">
                <p id="game-status-text"></p>
                <div class="word-reveal">
                    The word was: <strong id="target-word-display"></strong>
                </div>
                <button id="play-again-btn" class="primary-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
